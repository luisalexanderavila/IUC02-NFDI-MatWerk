name: Update from RWTH GitLab

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-from-rwth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make local main match latest GitHub main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Fetch RWTH repository
        run: |
          git remote add upstream https://git.rwth-aachen.de/nfdi-matwerk/iuc02.git
          git fetch upstream

      - name: Merge RWTH changes
        run: |
          git merge upstream/main --no-edit

      - name: Rebase on latest GitHub main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push changes to GitHub
        run: |
          git push origin main --force-with-lease
