name: Update from RWTH GitLab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update local main from GitHub
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Fetch RWTH repository
        run: |
          git remote add upstream https://git.rwth-aachen.de/nfdi-matwerk/iuc02.git
          git fetch upstream

      - name: Merge RWTH changes
        run: |
          git merge upstream/main --no-edit

      - name: Push to GitHub
        run: |
          git push origin main
